<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – TerpzyVerse/ClubSocial</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: url('assets/terpzyverse-bg.png') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Orbitron', sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2em;
    }
    h1 {
      margin-bottom: 1em;
      text-shadow: 0 0 10px red, 0 0 20px green;
    }
    .dashboard-links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 2em;
      width: 100%;
      max-width: 1000px;
    }
    .card {
      background: rgba(0, 0, 0, 0.8);
      padding: 1.5em;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 10px red, 0 0 15px green;
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card h2 {
      margin-bottom: 0.5em;
    }
    .card button {
      margin-top: 1em;
      padding: 0.5em 1.2em;
      background: red;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
    .wallet-preview {
      margin-top: 3em;
      padding: 1.5em;
      background: rgba(0,0,0,0.85);
      border-radius: 10px;
      box-shadow: 0 0 10px red, 0 0 15px green;
      text-align: center;
    }
    .wallet-preview a {
      display: inline-block;
      margin-top: 1em;
      color: #66ccff;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Welcome to Your Dashboard</h1>
  <div class="dashboard-links">
    <div class="card">
      <h2>Store</h2>
      <p>Buy $TRPZ packages & in-game items</p>
      <button onclick="location.href='store.html'">Visit Store</button>
    </div>
    <div class="card">
      <h2>Edit Profile</h2>
      <p>Change your avatar or personal info</p>
      <button onclick="location.href='edit-profile.html'">Edit Profile</button>
    </div>
    <div class="card">
      <h2>ClubSocial</h2>
      <p>Enter the social casino</p>
      <button onclick="location.href='https://clubsocial.click'">Launch ClubSocial</button>
    </div>
    <div class="card">
      <h2>Daily Spin Bonus</h2>
      <p>Claim your free daily prize</p>
      <button onclick="location.href='spin.html'">Spin Now</button>
    </div>
  </div>

  <div class="wallet-preview">
    <h2>VaultNova Wallet</h2>
    <a href="https://wallet.slot13studios.com/#records">View historical wallet balances</a>
  </div>
</body>
</html>
